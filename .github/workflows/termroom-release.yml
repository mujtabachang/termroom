name: Termroom Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/termroom-release.yml"

permissions:
  contents: write

concurrency:
  group: termroom-v0.1.0-alpha.2
  cancel-in-progress: false

env:
  RELEASE_VERSION: v0.1.0-alpha.2

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Build GhosttyKit
        run: zig build -Demit-macos-app=false

      - name: Build ad-hoc signed developer app
        run: |
          xcodebuild \
            -project macos/Ghostty.xcodeproj \
            -scheme Ghostty \
            -configuration ReleaseLocal \
            -derivedDataPath macos/build/ReleaseDerivedData \
            build

      - name: Verify app signature
        run: |
          codesign --force --deep --sign - --timestamp=none \
            macos/build/ReleaseDerivedData/Build/Products/ReleaseLocal/Termroom.app
          codesign --verify --deep --strict --verbose=2 \
            macos/build/ReleaseDerivedData/Build/Products/ReleaseLocal/Termroom.app

      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            macos/build/ReleaseDerivedData/Build/Products/ReleaseLocal/Termroom.app \
            Termroom-macOS-arm64-${RELEASE_VERSION}.zip
          shasum -a 256 Termroom-macOS-arm64-${RELEASE_VERSION}.zip \
            > Termroom-macOS-arm64-${RELEASE_VERSION}.zip.sha256

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_VERSION}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_VERSION}" --clobber \
              Termroom-macOS-arm64-${RELEASE_VERSION}.zip \
              Termroom-macOS-arm64-${RELEASE_VERSION}.zip.sha256
          else
            gh release create "${RELEASE_VERSION}" \
              --target "${GITHUB_SHA}" \
              --title "Termroom ${RELEASE_VERSION}" \
              --prerelease \
              --notes "Termroom multiplayer terminal developer preview. This build adds full Termroom app branding and icon, Playroom presence and cursors, signed expiring invites, role-gated terminal frames, and separate PTY-backed tmux clients. The app is ad-hoc signed and signature-verified, but is not Apple-notarized; on first launch, Control-click Termroom and choose Open. Do not grant terminal access to untrusted participants." \
              Termroom-macOS-arm64-${RELEASE_VERSION}.zip \
              Termroom-macOS-arm64-${RELEASE_VERSION}.zip.sha256
          fi
